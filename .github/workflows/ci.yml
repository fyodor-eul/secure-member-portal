name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017/tcp
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_CONNECT: mongodb://localhost:27018/ci
      APP_SECRET: ci-only-not-a-real-secret
      MAX_UPLOAD_BYTES: 2097152
      SPIKE_WINDOW_MS: 600000
      SPIKE_THRESHOLD_ACCOUNT: 5
      SPIKE_THRESHOLD_IP: 10

    steps:
      - name: Get the Code on the Runner
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test JS files
        run: |
          for f in $(git ls-files '*.js'); do
            echo "Checking $f..."
            node --check "$f"
          done
          echo "Exit Code: $?"

      - name: Smoke Test
        run: npm test
