name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the Code on the Runner
        uses: actions/checkout@v4

      - name: Setup NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Test JS files
        run: |
          for f in $(git ls-files '*.js'); do
            echo "Checking $f..."
            node --check "$f"
          done
          echo "Exit Code: $?"
